name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Codigo de la app
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar webOS SDK (ares-cli)
        run: npm install -g @webosose/ares-cli

      - name: Build IPK
        env:
          ZTV_PORTAL_KEY: ${{ secrets.ZTV_PORTAL_KEY }}
          ZTV_SNTOKEN_SALT: ${{ secrets.ZTV_SNTOKEN_SALT }}
          ZTV_LIVE_SALT: ${{ secrets.ZTV_LIVE_SALT }}
        run: pnpm build:webos

      - name: Publicar en el repo de distribucion
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          ipk="out/webos/com.zafiro.tv_${version}_all.ipk"
          test -f "$ipk" || { echo "no existe $ipk"; exit 1; }

          sha="$(sha256sum "$ipk" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"

          git clone "https://x-access-token:${DIST_TOKEN}@github.com/marelizal/ztv-dist.git" dist
          cd dist

          mkdir -p releases
          cp "../$ipk" "releases/com.zafiro.tv_${version}_all.ipk"

          cat > version.json <<JSON
          {
            "version": "${version}",
            "name": "z-tvsm",
            "minWebos": "1.0.0",
            "ipkUrl": "https://github.com/marelizal/ztv-dist/releases/download/v${version}/com.zafiro.tv_${version}_all.ipk",
            "sha256": "${sha}",
            "changelog": "Publicacion automatica de ${version}.",
            "releaseDate": "$(date -u +%Y-%m-%d)"
          }
          JSON

          git config user.name "ztvsm-publish"
          git config user.email "publish@users.noreply.github.com"
          git add version.json "releases/com.zafiro.tv_${version}_all.ipk"
          git commit -m "release: v${version}"
          git push origin HEAD:main

          cd ..
          gh release create "v${version}" "$ipk" \
            --repo marelizal/ztv-dist \
            --title "z-tvsm v${version}" \
            --notes "Version ${version}."
