name: seeds

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Semillas nuevas a acuñar"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: seeds
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Codigo de la app
        uses: actions/checkout@v4

      - name: Pool actual (rama seeds del repo de distribucion)
        uses: actions/checkout@v4
        with:
          repository: marelizal/ztv-dist
          ref: seeds
          path: pool
          token: ${{ secrets.DIST_TOKEN }}

      - name: Conectar Cloudflare WARP (evita bloqueo de IP datacenter de Azure)
        uses: fscarmen/warp-on-actions@v1.4
        with:
          mode: wireguard
          stack: dual
        continue-on-error: true

      - name: Verificar IP de salida
        run: |
          curl -s https://cloudflare.com/cdn-cgi/trace || true

      - name: Acunar semillas
        run: node tools/mint-seeds.cjs --count "${{ inputs.count || '30' }}" --ttl-hours 7 --pool pool/seeds.json --out pool/seeds.json --soft-fail

      - name: Publicar pool
        working-directory: pool
        run: |
          git config user.name "ztvsm-seeds"
          git config user.email "seeds@users.noreply.github.com"
          git add seeds.json
          if git diff --cached --quiet; then
            echo "sin cambios en el pool"
            exit 0
          fi
          git commit -m "seeds: pool $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:seeds
