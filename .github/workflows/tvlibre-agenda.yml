name: tvlibre agenda

on:
  schedule:
    - cron: "7 * * * *" # cada hora (UTC), desfasado para evitar top-of-hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvlibre-agenda
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: Datos actuales (rama agenda)
        uses: actions/checkout@v4
        with:
          ref: agenda
          path: data
        continue-on-error: true

      - name: Preparar rama de datos
        shell: bash
        run: |
          if [ ! -d data/.git ]; then
            mkdir -p data
            cd data
            git init
            git checkout --orphan agenda
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Obtener agenda de tvlibre.st
        run: |
          mkdir -p data
          python3 tools/fetch_tvlibre_agenda.py --out data/tvlibre-agenda.json --pretty

      - name: Publicar agenda
        working-directory: data
        shell: bash
        run: |
          git config user.name "ztvsm-agenda"
          git config user.email "agenda@users.noreply.github.com"
          git add tvlibre-agenda.json
          if git diff --cached --quiet; then
            echo "sin cambios en la agenda"
            exit 0
          fi
          git commit -m "agenda: tvlibre $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:agenda
