name: sports (la18hd + tvlibre)

on:
  schedule:
    - cron: "0 * * * *" # cada hora (minuto 0, UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: Generar sports.json (verifica canales la18hd y obtiene agenda tvlibre)
        id: build
        shell: bash
        run: |
          set +e
          python3 tools/build_sports.py --out sports.json --pretty
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # El archivo se genera siempre; exit 2 indica canales la18hd deshabilitados por check.

      - name: Publicar sports.json (archivo único)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          WORKDIR="$(mktemp -d)"
          if git clone --depth 1 --branch agenda "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORKDIR"; then
            :
          else
            mkdir -p "$WORKDIR"
            cd "$WORKDIR"
            git init
            git checkout --orphan agenda
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          cp sports.json "$WORKDIR/sports.json"
          cd "$WORKDIR"
          git rm -f tvlibre-agenda.json 2>/dev/null || true
          git add sports.json
          if git diff --cached --quiet; then
            echo "sin cambios en sports.json"
            exit 0
          fi
          git config user.name "ztvsm-sports"
          git config user.email "sports@users.noreply.github.com"
          git commit -m "sports: renovar $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:agenda

      - name: Publicar artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports
          path: sports.json

      - name: Resumen de estado
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('sports.json', encoding='utf-8'))
          la = d.get('la18', {})
          tv = d.get('tvlibre', {})
          print(f"la18: {la.get('ok')}/{la.get('total')} habilitados")
          print(f"tvlibre: {tv.get('count')} eventos ({tv.get('date')})")
          for country, channels in (la.get('countries') or {}).items():
              for ch in channels:
                  if not ch.get('enabled'):
                      detail = (ch.get('check') or {}).get('detail') or ch.get('error') or ''
                      print(f"- [INHABILITADO] {ch.get('name')} ({ch.get('stream')}) [{country}]: {detail}")
          PY

      - name: Validar estado la18hd
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            echo "Todos los canales la18hd habilitados."
            exit 0
          fi
          echo "Hay canales la18hd inhabilitados (ver resumen)."
          exit 1
