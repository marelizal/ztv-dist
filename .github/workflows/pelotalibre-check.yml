name: la18hd links check

on:
  schedule:
    - cron: "0 * * * *" # cada hora (minuto 0, UTC)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar y renovar enlaces la18hd (TV/Deportes)
        id: pelotalibre
        shell: bash
        run: |
          set +e
          python3 tools/renew_pelotalibre_links.py --check --json > pelotalibre-status.json
          code=$?
          cat pelotalibre-status.json 2>/dev/null || echo '{"ok":0,"total":0,"error":"sin salida JSON"}' > pelotalibre-status.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Publicar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la18hd-status
          path: pelotalibre-status.json

      - name: Validar estado
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('pelotalibre-status.json', encoding='utf-8'))
          except Exception as e:
              print(f"Error leyendo resultado: {e}")
              sys.exit(1)
          ok = int(d.get('ok', 0))
          total = int(d.get('total', 0))
          print(f"la18hd: {ok}/{total} canales activos OK")
          for ch in d.get('channels', []):
              status = 'OK' if ch.get('ok') else 'FALLO'
              country = ch.get('country') or ''
              print(f"- [{status}] {ch.get('name')} ({ch.get('stream')}) [{country}]: {ch.get('error') or (ch.get('check') or {}).get('detail') or ch.get('url') or ''}")
          sys.exit(0 if total > 0 and ok == total else 1)
          PY
